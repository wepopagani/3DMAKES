[[redirects]]
  from = "/registrazione"
  to = "/registrazione/"
  status = 200
  force = false

[[redirects]]
  from = "/registrazione/*"
  to = "/registrazione/index.html"
  status = 200

# SPA: se una route non è prerenderizzata, React Router la apre lo stesso.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200