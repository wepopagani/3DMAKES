[build]
  command = "npm config set legacy-peer-deps true && npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Chiavi web Firebase (pubbliche nel client). Lo scanner di Netlify le segnala come segreti e blocca la build.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyC6i0YOfn2YrasjYm13YrQmUr3c2RLtv0M,AIzaSyCBUMEwdWXnPKaMdkhtPSMwouMFeyDlsH0,AIzaSyA36G825R6uYJ1RxAF6NUfPRUkbSYCSCwc"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Nota audit SEO/GEO v3.0 (aprile 2026): il sito è pre-renderizzato a BUILD TIME
# da `vite-plugin-prerender` (vedi vite.config.ts) per tutte le 37 route principali.
# Ogni route ha il proprio `dist/<route>/index.html` con HTML completo leggibile
# senza JS — quindi Prerender.io/SSR runtime NON sono necessari.
# Per aggiungere nuove route al prerender: aggiornare l'array `routes` in vite.config.ts.

[[headers]]
  for = "/vcard/marco-pagani.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "inline; filename=\"Marco-Pagani.vcf\""
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/vcard/matteo-verdicchio.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "inline; filename=\"Matteo-Verdicchio.vcf\""
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/vcard/francesco-culici.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "inline; filename=\"Francesco-Culici.vcf\""
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/marco"
  to = "/marco/index.html"
  status = 200

[[redirects]]
  from = "/marco/"
  to = "/marco/index.html"
  status = 200

[[redirects]]
  from = "/Marco"
  to = "/marco/index.html"
  status = 200

