<style>
  :root {
    --blu: #1A2B5F;
    --azzurro: #1E9FD8;
    --beige: #EDE8E1;
    --testo: #1C1C2E;
    --grigio: #5C6570;
    --bianco: #fff;
    --side: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Montserrat, sans-serif;
    background: var(--blu);
    color: var(--testo);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    min-height: 100dvh;
    display: flex;
  }
  .card {
    width: 100%;
    min-height: 100dvh;
    background: var(--bianco);
    display: flex;
    flex-direction: column;
  }
  .hero {
    background: linear-gradient(180deg, #243770 0%, var(--blu) 72%, #1a4d86 100%);
    color: var(--bianco);
    text-align: center;
    padding: calc(18px + env(safe-area-inset-top)) var(--side) 28px;
  }
  .brand {
    display: inline-block;
    color: inherit;
    text-decoration: none;
    font-weight: 800;
    letter-spacing: .16em;
    font-size: 11px;
  }
  .brand span { color: var(--azzurro); }
  h1 {
    margin: 22px 0 0;
    font-size: clamp(26px, 8vw, 32px);
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .org {
    margin: 10px 0 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(255,255,255,.72);
  }
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 22px var(--side) calc(18px + env(safe-area-inset-bottom));
  }
  .save {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 54px;
    border-radius: 16px;
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    background: var(--azzurro);
    color: var(--bianco);
  }
  .save:active { transform: translateY(1px); }
  .list {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    margin-top: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 56px;
    padding: 8px 2px;
    border-top: 1px solid #efeae4;
    color: inherit;
    text-decoration: none;
  }
  .icon {
    width: 44px;
    height: 44px;
    flex: none;
    border-radius: 14px;
    background: var(--beige);
    color: var(--blu);
    display: grid;
    place-items: center;
  }
  .copy { min-width: 0; }
  .copy strong {
    display: block;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .copy small {
    display: block;
    margin-top: 3px;
    color: var(--grigio);
    font-size: 13px;
    font-weight: 600;
  }
  .hint {
    margin: 4px 0 0;
    text-align: center;
    color: var(--grigio);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
  }
  @media (min-width: 760px) {
    body {
      background:
        radial-gradient(900px 420px at 50% 0%, rgba(30,159,216,.28), transparent 60%),
        var(--blu);
    }
    .wrap {
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      width: min(420px, 100%);
      min-height: 0;
      height: min(820px, calc(100dvh - 64px));
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0,0,0,.28);
    }
    .hero { padding-top: 26px; }
